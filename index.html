<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020711">

<title>RHOODVAULT</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#020711;
    --blue:#0798ff;
    --cyan:#57ddff;
    --dark:#061426;
    --line:#124b78;
    --text:#e9f8ff;
    --muted:#7698b2;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
    radial-gradient(circle at 50% -20%,#0a3c70,#020711 55%);
    color:var(--text);
    font-family:Arial,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

/* PIXEL GRID */

body:before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-5;
    background-image:
        linear-gradient(rgba(0,145,255,.06) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,145,255,.06) 1px,transparent 1px);
    background-size:32px 32px;
    pointer-events:none;
}

/* SCANLINES */

body:after{
    content:"";
    position:fixed;
    inset:0;
    z-index:9999;
    pointer-events:none;
    opacity:.045;
    background:
    repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        #4acbff 4px
    );
}

/* ================= NAVBAR ================= */

.navbar{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(2,7,17,.94);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(15px);
}

.nav-inner{
    max-width:1200px;
    height:76px;
    margin:auto;
    padding:0 22px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-family:'Press Start 2P',monospace;
    color:white;
    font-size:16px;
    cursor:pointer;
    text-shadow:
    0 0 8px #fff,
    0 0 20px #008cff;
    white-space:nowrap;
}

.logo span{
    color:var(--blue);
}

/* DESKTOP NAV */

.nav-links{
    display:flex;
    align-items:center;
    gap:20px;
}

.nav-links a{
    color:#8caec5;
    text-decoration:none;
    font-family:'Press Start 2P',monospace;
    font-size:8px;
    cursor:pointer;
    transition:.2s;
}

.nav-links a:hover,
.nav-links a.active{
    color:var(--cyan);
    text-shadow:0 0 12px #009dff;
}

/* BUTTON */

.btn{
    border:1px solid #159eff;
    background:
    linear-gradient(
        180deg,
        #087ac5,
        #034676
    );

    color:white;
    padding:14px 17px;

    font-family:'Press Start 2P',monospace;
    font-size:8px;

    cursor:pointer;

    clip-path:polygon(
        5px 0,
        calc(100% - 5px) 0,
        100% 5px,
        100% calc(100% - 5px),
        calc(100% - 5px) 100%,
        5px 100%,
        0 calc(100% - 5px),
        0 5px
    );

    box-shadow:
    0 0 18px rgba(0,140,255,.3);

    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:
    0 0 25px rgba(0,170,255,.7);
}

/* MOBILE MENU */

.menu-btn{
    display:none;
}

/* ================= HERO ================= */

.hero{
    min-height:calc(100vh - 76px);

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:70px 20px;

    position:relative;
}

.hero-content{
    width:100%;
    max-width:900px;
}

.eyebrow{
    color:var(--cyan);
    font-family:'Press Start 2P',monospace;
    font-size:9px;
    letter-spacing:2px;
    line-height:1.8;
}

.hero h1{
    margin:25px 0;

    font-family:'Press Start 2P',monospace;

    font-size:clamp(28px,7vw,70px);

    line-height:1.3;

    text-shadow:
    0 0 7px white,
    0 0 25px #008cff;
}

.hero h1 span{
    color:#20b6ff;
}

.hero p{
    max-width:700px;
    margin:0 auto 35px;

    color:#86a9c0;

    font-size:16px;
    line-height:1.9;
}

.hero-buttons{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
}

/* ================= VAULT ================= */

.vault{
    width:190px;
    height:190px;

    margin:45px auto;

    background:
    radial-gradient(circle,#0c4778,#041322 65%);

    border:8px solid #118dd3;

    box-shadow:
    0 0 0 6px #062b48,
    0 0 0 10px #0b5a89,
    0 0 45px #008cffaa;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    animation:float 4s ease-in-out infinite;
}

.vault:before{
    content:"";

    position:absolute;
    inset:22px;

    border:4px dashed var(--cyan);

    border-radius:50%;

    animation:spin 8s linear infinite;
}

.vault:after{
    content:"";

    width:10px;
    height:65px;

    background:#61ddff;

    box-shadow:0 0 20px #00aaff;

    position:absolute;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* ================= PAGE ================= */

.page{
    max-width:1200px;
    margin:auto;
    padding:70px 22px;
    min-height:calc(100vh - 76px);
}

.page-title{
    font-family:'Press Start 2P',monospace;
    font-size:26px;
    margin:12px 0 18px;
}

.page-description{
    color:var(--muted);
    line-height:1.8;
    margin-bottom:35px;
}

/* ================= GRID ================= */

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.card{
    background:
    linear-gradient(
        145deg,
        rgba(7,27,48,.95),
        rgba(2,10,20,.95)
    );

    border:1px solid var(--line);

    padding:22px;

    position:relative;

    overflow:hidden;

    box-shadow:
    0 0 20px rgba(0,100,180,.08);

    transition:.25s;
}

.card:hover{
    border-color:#169fe9;
    box-shadow:
    0 0 25px rgba(0,150,255,.25);
    transform:translateY(-3px);
}

.card h3{
    font-family:'Press Start 2P',monospace;
    font-size:12px;
    margin:14px 0;
}

.card p{
    color:var(--muted);
    line-height:1.7;
}

.tag{
    display:inline-block;

    font-family:'Press Start 2P',monospace;
    font-size:7px;

    color:var(--cyan);

    border:1px solid #15557e;

    padding:7px 9px;
}

/* MINI VAULT */

.mini-vault{
    height:190px;

    background:
    radial-gradient(circle,#0b426d,#030b15);

    display:flex;
    align-items:center;
    justify-content:center;

    margin:-22px -22px 20px;
}

.mini-vault div{
    width:105px;
    height:105px;

    border:7px solid #138fd4;

    border-radius:50%;

    box-shadow:
    0 0 30px #008cff88,
    inset 0 0 25px #008cff55;
}

/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:20px;
}

.stat{
    background:#04101e;
    border:1px solid var(--line);
    padding:20px;
}

.stat b{
    display:block;
    font-family:'Press Start 2P',monospace;
    font-size:15px;
    color:var(--cyan);
    margin-bottom:10px;
}

.stat small{
    color:var(--muted);
}

/* ================= TABLE ================= */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:650px;
}

th,td{
    padding:18px;
    border-bottom:1px solid var(--line);
    text-align:left;
}

th{
    color:var(--cyan);
    font-family:'Press Start 2P',monospace;
    font-size:8px;
}

td{
    color:#9db8ca;
}

/* ================= PROGRESS ================= */

.progress{
    height:10px;
    background:#020810;
    border:1px solid var(--line);
    margin:12px 0 20px;
}

.progress span{
    display:block;
    height:100%;

    background:
    linear-gradient(
        90deg,
        #006eff,
        #58ddff
    );

    box-shadow:0 0 15px #008cff;
}

/* ================= FOOTER ================= */

.footer{
    border-top:1px solid var(--line);

    padding:30px 20px;

    text-align:center;

    color:#52738c;

    font-size:10px;

    font-family:'Press Start 2P',monospace;

    line-height:2;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;

    right:20px;
    bottom:20px;

    background:#06213a;

    border:1px solid #159eff;

    padding:15px 18px;

    font-size:12px;

    box-shadow:0 0 25px #008cff55;

    display:none;

    z-index:99999;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

    .nav-inner{
        height:68px;
        padding:0 16px;
    }

    .logo{
        font-size:11px;
    }

    .menu-btn{
        display:block;
    }

    .nav-links{
        position:absolute;

        top:68px;
        left:0;
        right:0;

        width:100%;

        display:none;

        flex-direction:column;

        align-items:stretch;

        gap:0;

        padding:10px 16px 18px;

        background:#030b17;

        border-bottom:1px solid var(--line);

        box-shadow:0 20px 40px rgba(0,0,0,.6);
    }

    .nav-links.open{
        display:flex;
    }

    .nav-links a{
        padding:18px 10px;

        border-bottom:1px solid #10334f;

        font-size:8px;
    }

    .nav-links .btn{
        width:100%;
        margin-top:12px;
    }

    .hero{
        min-height:calc(100vh - 68px);
        padding:45px 17px;
    }

    .eyebrow{
        font-size:7px;
    }

    .hero h1{
        font-size:clamp(23px,8vw,42px);
    }

    .hero p{
        font-size:14px;
    }

    .hero-buttons{
        flex-direction:column;
        width:100%;
        max-width:350px;
        margin:auto;
    }

    .hero-buttons .btn{
        width:100%;
    }

    .vault{
        width:150px;
        height:150px;
        margin:30px auto;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .page{
        padding:50px 17px;
    }

    .page-title{
        font-size:20px;
        line-height:1.5;
    }
}

/* SMALL MOBILE */

@media(max-width:420px){

    .logo{
        font-size:9px;
    }

    .hero h1{
        font-size:22px;
    }

    .hero p{
        font-size:13px;
    }

    .vault{
        width:130px;
        height:130px;
    }

    .vault:before{
        inset:15px;
    }

    .page-title{
        font-size:17px;
    }
}
</style>

<script>

/* =========================================
   STATE
========================================= */

let state = JSON.parse(
    localStorage.getItem("rhoodState")
) || {

    connected:false,

    xp:1250,

    points:680,

    level:7,

    quests:{}

};


function save(){

    localStorage.setItem(
        "rhoodState",
        JSON.stringify(state)
    );

}


/* =========================================
   TOAST
========================================= */

function toast(message){

    const box =
        document.getElementById("toast");

    box.textContent = message;

    box.style.display = "block";

    setTimeout(function(){

        box.style.display = "none";

    },2200);

}


/* =========================================
   ROUTER
========================================= */

function getPage(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("page") || "home";

}


function go(page){

    if(page === "home"){

        history.pushState(
            {},
            "",
            window.location.pathname
        );

    }else{

        history.pushState(
            {},
            "",
            "?page=" + page
        );

    }

    render();

    window.scrollTo(0,0);

    closeMenu();

}


/* Browser back/forward */

window.addEventListener(
    "popstate",
    render
);


/* =========================================
   MENU
========================================= */

const menuBtn =
    document.getElementById("menuBtn");

const navLinks =
    document.getElementById("navLinks");


menuBtn.addEventListener(
    "click",
    function(){

        navLinks.classList.toggle(
            "open"
        );

    }
);


function closeMenu(){

    navLinks.classList.remove(
        "open"
    );

}


/* =========================================
   REAL WALLET
========================================= */

const RH_CHAIN_ID = 4663;

const RH_NETWORK = {
    chainId: "0x1237",
    chainName: "Robinhood Chain",

    nativeCurrency: {
        name: "Ether",
        symbol: "ETH",
        decimals: 18
    },

    rpcUrls: [
        "https://rpc.mainnet.chain.robinhood.com"
    ],

    blockExplorerUrls: [
        "https://robinhoodchain.blockscout.com"
    ]
};

let walletAddress = null;
let walletProvider = null;
let walletSigner = null;


/* CONNECT */

async function connectWallet(){

    if(!window.ethereum){

        toast("Please open RHOODVAULT in an EVM wallet");

        return;
    }

    try{

        const accounts =
            await window.ethereum.request({
                method:"eth_requestAccounts"
            });

        if(!accounts.length) return;

        walletProvider =
            new ethers.BrowserProvider(
                window.ethereum
            );

        let network =
            await walletProvider.getNetwork();

        /* Switch to Robinhood Chain */

        if(
            Number(network.chainId) !==
            RH_CHAIN_ID
        ){

            try{

                await window.ethereum.request({
                    method:
                    "wallet_switchEthereumChain",

                    params:[
                        {
                            chainId:
                            RH_NETWORK.chainId
                        }
                    ]
                });

            }catch(error){

                /* Add Robinhood Chain */

                if(error.code === 4902){

                    await window.ethereum.request({
                        method:
                        "wallet_addEthereumChain",

                        params:[
                            RH_NETWORK
                        ]
                    });

                }else{

                    throw error;

                }

            }

            walletProvider =
                new ethers.BrowserProvider(
                    window.ethereum
                );
        }


        walletSigner =
            await walletProvider.getSigner();

        walletAddress =
            await walletSigner.getAddress();


        state.connected = true;

        state.wallet =
            walletAddress;

        save();

        updateWallet();

        toast(
            "Wallet connected"
        );

        renderVaultWallet();

    }catch(error){

        console.error(error);

        toast(
            "Wallet connection failed"
        );

    }

}


/* DISCONNECT */

function disconnectWallet(){

    walletAddress = null;

    walletProvider = null;

    walletSigner = null;

    state.connected = false;

    state.wallet = null;

    save();

    updateWallet();

    toast(
        "Wallet disconnected"
    );

}


/* WALLET BUTTON */

walletBtn.onclick = async function(){

    if(walletAddress){

        disconnectWallet();

    }else{

        await connectWallet();

    }

};


/* UPDATE BUTTON */

function updateWallet(){

    if(walletAddress){

        walletBtn.textContent =
            walletAddress.slice(0,6) +
            "..." +
            walletAddress.slice(-4);

    }else{

        walletBtn.textContent =
            "CONNECT WALLET";

    }

}


/* RESTORE CONNECTION */

async function restoreWallet(){

    if(!window.ethereum) return;

    try{

        const accounts =
            await window.ethereum.request({
                method:"eth_accounts"
            });

        if(
            accounts &&
            accounts.length
        ){

            walletProvider =
                new ethers.BrowserProvider(
                    window.ethereum
                );

            const network =
                await walletProvider.getNetwork();

            if(
                Number(network.chainId) ===
                RH_CHAIN_ID
            ){

                walletSigner =
                    await walletProvider.getSigner();

                walletAddress =
                    accounts[0];

                state.connected = true;

                state.wallet =
                    walletAddress;

                save();

            }

        }

    }catch(error){

        console.log(
            "Wallet restore:",
            error
        );

    }

    updateWallet();

}


/* ACCOUNT CHANGE */

if(window.ethereum){

    window.ethereum.on(
        "accountsChanged",
        function(accounts){

            if(!accounts.length){

                disconnectWallet();

                return;

            }

            walletAddress =
                accounts[0];

            state.connected = true;

            state.wallet =
                walletAddress;

            save();

            updateWallet();

        }
    );


    window.ethereum.on(
        "chainChanged",
        function(){

            window.location.reload();

        }
    );

}

];

return `

</div>

VAULT QUESTS
</h1>

</p>

</span>

${item[1]}
</h3>

increase your vault progression.
</p>

+${item[2]} XP
<br>
+${item[3]} POINTS
</p>

<button
class="btn"
onclick="completeQuest(
'${item[0]}',
${item[2]},
${item[3]}
)">

${
state.quests[item[0]]
? "COMPLETED"
: "COMPLETE"
}

</button>

</div>

`).join("")}

</div>

</section>

`;

}


function completeQuest(id,xp,points){

if(state.quests[id]){

toast("Quest already completed");

return;

}

state.quests[id]=true;

state.xp += xp;

state.points += points;

state.level =
Math.floor(state.xp / 180)+1;

save();

toast(
"Quest completed! +" +
xp +
" XP / +" +
points +
" Points"
);

render();

}

}

========================================= */

function render(){

const page=getPage();

let content;

switch(page){

case "collection":
content=collection();
break;

case "mint":
content=mint();
break;

case "vault":
content=vaultPage();
break;

case "quests":
content=quests();
break;

case "rewards":
content=rewards();
break;

case "leaderboard":
content=leaderboard();
break;

default:
content=home();

}


document.getElementById(
"app"
).innerHTML=content;


updateWallet();


/* active menu */

document
.querySelectorAll(".nav-links a")
.forEach(a=>{
    a.classList.remove("active");
});


}


/* START */

render();
