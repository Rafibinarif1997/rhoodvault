<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020711">
<title>RHOODVAULT</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.15.0/dist/ethers.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#020711;--blue:#0798ff;--cyan:#57ddff;--dark:#061426;--line:#124b78;--text:#e9f8ff;--muted:#7698b2}
body{background:radial-gradient(circle at 50% -20%,#0a3c70,#020711 55%);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-5;background-image:linear-gradient(rgba(0,145,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,145,255,.06) 1px,transparent 1px);background-size:32px 32px}
body:after{content:"";position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:.045;background:repeating-linear-gradient(0deg,transparent,transparent 3px,#4acbff 4px)}
.navbar{position:sticky;top:0;z-index:1000;background:rgba(2,7,17,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(15px)}
.nav-inner{max-width:1200px;height:76px;margin:auto;padding:0 22px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Press Start 2P',monospace;color:white;font-size:16px;cursor:pointer;text-shadow:0 0 8px #fff,0 0 20px #008cff;white-space:nowrap}.logo span{color:var(--blue)}
.nav-links{display:flex;align-items:center;gap:20px}.nav-links a{color:#8caec5;text-decoration:none;font-family:'Press Start 2P',monospace;font-size:8px;cursor:pointer}.nav-links a:hover{color:var(--cyan);text-shadow:0 0 12px #009dff}
.btn{border:1px solid #159eff;background:linear-gradient(180deg,#087ac5,#034676);color:white;padding:14px 17px;font-family:'Press Start 2P',monospace;font-size:8px;cursor:pointer;clip-path:polygon(5px 0,calc(100% - 5px) 0,100% 5px,100% calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,0 calc(100% - 5px),0 5px);box-shadow:0 0 18px rgba(0,140,255,.3);transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 0 25px rgba(0,170,255,.7)}
.menu-btn{display:none}.hero{min-height:calc(100vh - 76px);display:flex;align-items:center;justify-content:center;text-align:center;padding:70px 20px}.hero-content{width:100%;max-width:900px}.eyebrow{color:var(--cyan);font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:2px;line-height:1.8}.hero h1{margin:25px 0;font-family:'Press Start 2P',monospace;font-size:clamp(28px,7vw,70px);line-height:1.3;text-shadow:0 0 7px white,0 0 25px #008cff}.hero h1 span{color:#20b6ff}.hero p{max-width:700px;margin:0 auto 35px;color:#86a9c0;font-size:16px;line-height:1.9}.hero-buttons{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.vault{width:190px;height:190px;margin:45px auto;background:radial-gradient(circle,#0c4778,#041322 65%);border:8px solid #118dd3;box-shadow:0 0 0 6px #062b48,0 0 0 10px #0b5a89,0 0 45px #008cffaa;display:flex;align-items:center;justify-content:center;position:relative;animation:float 4s ease-in-out infinite}.vault:before{content:"";position:absolute;inset:22px;border:4px dashed var(--cyan);border-radius:50%;animation:spin 8s linear infinite}.vault:after{content:"";width:10px;height:65px;background:#61ddff;box-shadow:0 0 20px #00aaff;position:absolute}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes spin{to{transform:rotate(360deg)}}
.page{max-width:1200px;margin:auto;padding:70px 22px;min-height:calc(100vh - 76px)}.page-title{font-family:'Press Start 2P',monospace;font-size:26px;margin:12px 0 18px}.page-description{color:var(--muted);line-height:1.8;margin-bottom:35px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:linear-gradient(145deg,rgba(7,27,48,.95),rgba(2,10,20,.95));border:1px solid var(--line);padding:22px;position:relative;overflow:hidden;box-shadow:0 0 20px rgba(0,100,180,.08);transition:.25s}.card:hover{border-color:#169fe9;box-shadow:0 0 25px rgba(0,150,255,.25);transform:translateY(-3px)}.card h3{font-family:'Press Start 2P',monospace;font-size:12px;margin:14px 0}.card p{color:var(--muted);line-height:1.7}.tag{display:inline-block;font-family:'Press Start 2P',monospace;font-size:7px;color:var(--cyan);border:1px solid #15557e;padding:7px 9px}
.mini-vault{height:190px;background:radial-gradient(circle,#0b426d,#030b15);display:flex;align-items:center;justify-content:center;margin:-22px -22px 20px}.mini-vault div{width:105px;height:105px;border:7px solid #138fd4;border-radius:50%;box-shadow:0 0 30px #008cff88,inset 0 0 25px #008cff55}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.stat{background:#04101e;border:1px solid var(--line);padding:20px}.stat b{display:block;font-family:'Press Start 2P',monospace;font-size:15px;color:var(--cyan);margin-bottom:10px}.stat small{color:var(--muted)}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:18px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--cyan);font-family:'Press Start 2P',monospace;font-size:8px}td{color:#9db8ca}
.progress{height:10px;background:#020810;border:1px solid var(--line);margin:12px 0 20px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#006eff,#58ddff);box-shadow:0 0 15px #008cff}
.footer{border-top:1px solid var(--line);padding:30px 20px;text-align:center;color:#52738c;font-size:10px;font-family:'Press Start 2P',monospace;line-height:2}.toast{position:fixed;right:20px;bottom:20px;background:#06213a;border:1px solid #159eff;padding:15px 18px;font-size:12px;box-shadow:0 0 25px #008cff55;display:none;z-index:99999;max-width:min(520px,calc(100vw - 40px));line-height:1.5}
.wallet-ok{border-color:#00ffc8!important;color:#baffef!important}.wallet-status{margin-top:18px;padding:14px;border:1px solid var(--line);background:#04101e;color:#8db4cc;font-size:12px;line-height:1.7}.wallet-status strong{color:var(--cyan)}
@media(max-width:900px){.nav-inner{height:68px;padding:0 16px}.logo{font-size:11px}.menu-btn{display:block}.nav-links{position:absolute;top:68px;left:0;right:0;width:100%;display:none;flex-direction:column;align-items:stretch;gap:0;padding:10px 16px 18px;background:#030b17;border-bottom:1px solid var(--line)}.nav-links.open{display:flex}.nav-links a{padding:18px 10px;border-bottom:1px solid #10334f;font-size:8px}.nav-links .btn{width:100%;margin-top:12px}.hero{min-height:calc(100vh - 68px);padding:45px 17px}.eyebrow{font-size:7px}.hero h1{font-size:clamp(23px,8vw,42px)}.hero p{font-size:14px}.hero-buttons{flex-direction:column;width:100%;max-width:350px;margin:auto}.hero-buttons .btn{width:100%}.vault{width:150px;height:150px;margin:30px auto}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.page{padding:50px 17px}.page-title{font-size:20px;line-height:1.5}}
@media(max-width:420px){.logo{font-size:9px}.hero h1{font-size:22px}.hero p{font-size:13px}.vault{width:130px;height:130px}.vault:before{inset:15px}.page-title{font-size:17px}}
</style>
</head>
<body>
<header class="navbar"><div class="nav-inner">
<div class="logo" onclick="go('home')">RHOOD<span>VAULT</span></div>
<button class="btn menu-btn" id="menuBtn">MENU</button>
<nav class="nav-links" id="navLinks">
<a onclick="go('home')">HOME</a><a onclick="go('collection')">COLLECTION</a><a onclick="go('mint')">MINT</a><a onclick="go('vault')">MY VAULT</a><a onclick="go('quests')">QUESTS</a><a onclick="go('rewards')">REWARDS</a><a onclick="go('leaderboard')">LEADERBOARD</a>
<button class="btn" id="walletBtn">CONNECT WALLET</button>
</nav></div></header>
<div id="app"></div>
<footer class="footer">RHOODVAULT © 2026<br>DIGITAL VAULTS FROM THE FUTURE</footer>
<div class="toast" id="toast"></div>

<script>
const RH_CHAIN_ID=4663, RH_CHAIN_HEX="0x1237";
const RH_NETWORK={chainId:RH_CHAIN_HEX,chainName:"Robinhood Chain",nativeCurrency:{name:"Ether",symbol:"ETH",decimals:18},rpcUrls:["https://rpc.mainnet.chain.robinhood.com/"],blockExplorerUrls:["https://robinhoodchain.blockscout.com/"]};
let state=JSON.parse(localStorage.getItem("rhoodState")||"null")||{connected:false,wallet:null,xp:1250,points:680,level:7,quests:{}};
let walletAddress=null,walletProvider=null,walletSigner=null;
function save(){localStorage.setItem("rhoodState",JSON.stringify(state))}
function toast(m){const b=document.getElementById("toast");b.textContent=m;b.style.display="block";clearTimeout(window.__t);window.__t=setTimeout(()=>b.style.display="none",3500)}
function short(a){return a?a.slice(0,6)+"..."+a.slice(-4):""}
function getPage(){return new URLSearchParams(location.search).get("page")||"home"}
function go(p){history.pushState({}, "", p==="home"?location.pathname:"?page="+p);render();scrollTo(0,0);closeMenu()}
addEventListener("popstate",render);
const menuBtn=document.getElementById("menuBtn"),navLinks=document.getElementById("navLinks");
menuBtn.onclick=()=>navLinks.classList.toggle("open"); function closeMenu(){navLinks.classList.remove("open")}
const walletBtn=document.getElementById("walletBtn");
async function connectWallet(){
 try{
  if(!window.ethereum){toast("No EVM wallet detected. Open RHOODVAULT inside your wallet browser.");return}
  toast("Opening wallet...");
  const accounts=await window.ethereum.request({method:"eth_requestAccounts"});
  if(!accounts?.length){toast("No wallet account selected.");return}
  walletProvider=new ethers.BrowserProvider(window.ethereum);
  let chainId=await window.ethereum.request({method:"eth_chainId"});
  if(chainId.toLowerCase()!==RH_CHAIN_HEX){
   toast("Please approve Robinhood Chain switch...");
   try{await window.ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:RH_CHAIN_HEX}]})}
   catch(e){
    if(e.code===4902){toast("Please approve adding Robinhood Chain...");await window.ethereum.request({method:"wallet_addEthereumChain",params:[RH_NETWORK]})}
    else throw e;
   }
  }
  walletProvider=new ethers.BrowserProvider(window.ethereum);
  walletSigner=await walletProvider.getSigner();
  walletAddress=await walletSigner.getAddress();
  state.connected=true;state.wallet=walletAddress;save();updateWallet();render();toast("Wallet connected successfully!");
 }catch(e){
  console.error("RHOODVAULT wallet error",e);
  const msg=e?.shortMessage||e?.message||"Unknown wallet error";
  toast("Wallet Error: "+msg.slice(0,180));
 }
}
function disconnectWallet(){walletAddress=null;walletProvider=null;walletSigner=null;state.connected=false;state.wallet=null;save();updateWallet();render();toast("Wallet disconnected")}
walletBtn.onclick=()=>walletAddress?disconnectWallet():connectWallet();
function updateWallet(){walletBtn.textContent=walletAddress?short(walletAddress):"CONNECT WALLET";walletBtn.classList.toggle("wallet-ok",!!walletAddress)}
async function restoreWallet(){
 if(!window.ethereum)return;
 try{
  const a=await window.ethereum.request({method:"eth_accounts"});
  if(a?.length){
   const c=await window.ethereum.request({method:"eth_chainId"});
   if(c.toLowerCase()===RH_CHAIN_HEX){walletProvider=new ethers.BrowserProvider(window.ethereum);walletSigner=await walletProvider.getSigner();walletAddress=a[0];state.connected=true;state.wallet=a[0];save()}
  }
 }catch(e){console.log("restore",e)} updateWallet();
}
if(window.ethereum){window.ethereum.on("accountsChanged",a=>{if(!a.length){disconnectWallet();return}walletAddress=a[0];state.connected=true;state.wallet=a[0];save();updateWallet();render()});window.ethereum.on("chainChanged",()=>location.reload())}

function home(){return `<section class="hero"><div class="hero-content"><div class="eyebrow">ROBINHOOD CHAIN • 1,111 VAULTS</div><div class="vault"></div><h1>ENTER THE<br><span>RHOODVAULT</span></h1><p>1111 futuristic digital vaults built for collectors, guardians and explorers. Unlock your vault. Complete missions. Level up.</p><div class="hero-buttons"><button class="btn" onclick="go('mint')">MINT YOUR VAULT</button><button class="btn" onclick="go('collection')">EXPLORE COLLECTION</button></div></div></section>`}
function collection(){let v=[["027","LEGENDARY","QUANTUM"],["091","EPIC","CYBER"],["404","RARE","BLACK OPS"],["611","COMMON","INDUSTRIAL"],["777","EPIC","NEON"],["1001","MYTHIC","ROYAL"]];return `<section class="page"><div class="eyebrow">THE COLLECTION</div><h1 class="page-title">1111 DIGITAL VAULTS</h1><p class="page-description">Every vault is a unique identity inside the RhoodVault universe.</p><div class="grid">${v.map(x=>`<div class="card"><div class="mini-vault"><div></div></div><span class="tag">${x[1]}</span><h3>VAULT #${x[0]}</h3><p>TYPE: ${x[2]}</p></div>`).join("")}</div></section>`}
function mint(){return `<section class="page"><div class="eyebrow">SECURE YOUR ACCESS</div><h1 class="page-title">MINT A VAULT</h1><p class="page-description">Secure your place inside the RhoodVault universe.</p><div class="grid"><div class="card"><div class="mini-vault" style="height:300px"><div style="width:160px;height:160px"></div></div></div><div class="card"><span class="tag">MINT STATUS</span><h3>1,111 VAULTS</h3><p>The real ERC-721 mint contract will be connected later.</p><div class="stats"><div class="stat"><b>1,111</b><small>SUPPLY</small></div><div class="stat"><b>ERC721</b><small>STANDARD</small></div><div class="stat"><b>RHC</b><small>NETWORK</small></div></div><br><button class="btn" onclick="connectWallet()">CONNECT WALLET</button></div></div></section>`}
function vaultPage(){let connected=walletAddress?`<div class="wallet-status">WALLET<br><strong>${walletAddress}</strong><br>NETWORK: <strong>Robinhood Chain</strong></div>`:`<div class="wallet-status">WALLET<br><strong>NOT CONNECTED</strong><br>Connect your wallet to prepare your personal vault.</div>`;return `<section class="page"><div class="eyebrow">PERSONAL COMMAND CENTER</div><h1 class="page-title">MY VAULT</h1><p class="page-description">Your personal progression, security and rewards.</p><div class="grid"><div class="card"><div class="mini-vault" style="height:280px"><div></div></div><span class="tag">LEGENDARY</span><h3>VAULT #027</h3>${connected}<div class="stats"><div class="stat"><b>${state.level}</b><small>LEVEL</small></div><div class="stat"><b>${state.xp.toLocaleString()}</b><small>XP</small></div><div class="stat"><b>${state.points.toLocaleString()}</b><small>POINTS</small></div></div></div><div class="card"><span class="tag">SECURITY CORE</span><h3>VAULT STATUS</h3><p>SECURITY</p><div class="progress"><span style="width:92%"></span></div><p>ENERGY</p><div class="progress"><span style="width:78%"></span></div><p>STORAGE</p><div class="progress"><span style="width:64%"></span></div></div></div></section>`}
function quests(){let q=[["daily","DAILY VAULT CHECK",20,10],["guardian","VAULT GUARDIAN",150,75],["community","COMMUNITY MISSION",100,50]];return `<section class="page"><div class="eyebrow">PROGRESSION SYSTEM</div><h1 class="page-title">VAULT QUESTS</h1><p class="page-description">Complete missions and earn XP + points.</p><div class="grid">${q.map(x=>`<div class="card"><span class="tag">QUEST</span><h3>${x[1]}</h3><p>Complete this mission to increase your vault progression.</p><br><p>+${x[2]} XP<br>+${x[3]} POINTS</p><br><button class="btn" onclick="completeQuest('${x[0]}',${x[2]},${x[3]})">${state.quests[x[0]]?"COMPLETED":"COMPLETE"}</button></div>`).join("")}</div></section>`}
function completeQuest(id,xp,points){if(state.quests[id])return toast("Quest already completed");state.quests[id]=true;state.xp+=xp;state.points+=points;state.level=Math.floor(state.xp/180)+1;save();toast(`Quest completed! +${xp} XP / +${points} Points`);render()}
function rewards(){let r=[["Vault Badge",500],["OG Guardian Badge",1000],["Mystery Skin",2500],["Future Mint Access",10000]];return `<section class="page"><div class="eyebrow">REWARD TERMINAL</div><h1 class="page-title">REDEEM POINTS</h1><p class="page-description">Available points: <strong style="color:#58ddff">${state.points}</strong></p><div class="grid">${r.map(x=>`<div class="card"><span class="tag">${x[1]} POINTS</span><h3>${x[0]}</h3><p>Unlock this digital reward with your earned points.</p><br><button class="btn" onclick="claimReward(${x[1]},'${x[0]}')">CLAIM</button></div>`).join("")}</div></section>`}
function claimReward(cost,name){if(state.points<cost)return toast("Not enough points");state.points-=cost;save();toast(name+" claimed — DEMO");render()}
function leaderboard(){return `<section class="page"><div class="eyebrow">GLOBAL RANKING</div><h1 class="page-title">LEADERBOARD</h1><p class="page-description">Top guardians by XP.</p><div class="card table-wrap"><table><thead><tr><th>RANK</th><th>GUARDIAN</th><th>VAULT</th><th>LEVEL</th><th>XP</th></tr></thead><tbody><tr><td>#01</td><td>0xA91...E21</td><td>#777</td><td>24</td><td>4,820</td></tr><tr><td>#02</td><td>0x31B...9C4</td><td>#404</td><td>21</td><td>4,110</td></tr><tr><td>#03</td><td>0xF72...8AA</td><td>#1001</td><td>20</td><td>3,940</td></tr><tr><td>#04</td><td>${walletAddress?short(walletAddress):"—"}</td><td>#027</td><td>${state.level}</td><td>${state.xp.toLocaleString()}</td></tr></tbody></table></div></section>`}
function render(){let p=getPage(),c=p==="collection"?collection():p==="mint"?mint():p==="vault"?vaultPage():p==="quests"?quests():p==="rewards"?rewards():p==="leaderboard"?leaderboard():home();document.getElementById("app").innerHTML=c;updateWallet()}
render();restoreWallet();
</script>
</body>
</html>
